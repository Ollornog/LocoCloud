---
# roles/clamav/tasks/nextcloud.yml
# Configure Nextcloud files_antivirus app to use ClamAV daemon via socket

- name: Install Nextcloud files_antivirus app
  ansible.builtin.command: >
    docker exec -u www-data nextcloud
    php occ app:install files_antivirus
  register: _nc_av_install
  changed_when: "'installed' in _nc_av_install.stdout"
  failed_when: false

- name: Enable Nextcloud files_antivirus app
  ansible.builtin.command: >
    docker exec -u www-data nextcloud
    php occ app:enable files_antivirus
  register: _nc_av_enable
  changed_when: "'enabled' in _nc_av_enable.stdout"
  failed_when: false

- name: Configure files_antivirus — ClamAV Daemon (Socket)
  ansible.builtin.command: >
    docker exec -u www-data nextcloud
    php occ config:app:set files_antivirus {{ item.key }} --value="{{ item.value }}"
  loop:
    - { key: "av_mode", value: "daemon" }
    - { key: "av_socket", value: "/var/run/clamav/clamd.sock" }
    - { key: "av_infected_action", value: "delete" }
    - { key: "av_max_file_size", value: "-1" }
    - { key: "av_stream_max_length", value: "104857600" }
  loop_control:
    label: "{{ item.key }}"
  changed_when: true
