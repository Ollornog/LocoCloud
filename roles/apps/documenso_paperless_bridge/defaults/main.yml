---
# roles/apps/documenso_paperless_bridge/defaults/main.yml
# Documenso→Paperless Bridge — Fertig signierte Dokumente automatisch archivieren
#
# Architecture:
#   Documenso (Dokument fertig signiert, Status COMPLETED)
#     ↓ Cron (alle 5 Min)
#   Python-Script fragt Documenso-PostgreSQL direkt ab
#     ↓ Extrahiert signiertes PDF aus DB
#   Paperless consume → /mnt/data/paperless/consume/
#     ↓ Paperless verarbeitet (OCR, Archiv)
#
# Kein API-Token noetig — das Script nutzt die DB-Credentials
# aus dem Documenso-Deployment direkt (docker exec).

# Documenso DB container name (must match documenso role)
documenso_paperless_db_container: "documenso-db"
documenso_paperless_db_user: "{{ documenso_db_user | default('documenso') }}"
documenso_paperless_db_name: "{{ documenso_db_name | default('documenso') }}"

# Paperless consume directory (must match paperless role)
documenso_paperless_consume_path: "/mnt/data/paperless/consume"

# Script and state paths
documenso_paperless_script_path: "/opt/scripts/documenso-to-paperless.py"
documenso_paperless_state_file: "/opt/scripts/.documenso-synced-ids"

# Cron schedule (default: every 5 minutes)
documenso_paperless_schedule: "*/5 * * * *"

# File prefix for synced documents in Paperless
documenso_paperless_file_prefix: "documenso"
