---
# roles/apps/paperless/tasks/main.yml

- name: Deploy Paperless-NGX
  ansible.builtin.import_tasks: deploy.yml
  tags: [paperless, deploy]

- name: Configure OIDC for Paperless
  ansible.builtin.import_tasks: oidc.yml
  tags: [paperless, oidc]
  when: paperless_oidc_enabled | default(false)

- name: Sync LLDAP groups to Paperless
  ansible.builtin.include_tasks: sync-groups.yml
  tags: [paperless, groups]
  when: paperless_group_sync_enabled | default(false)

- name: Configure group document permissions
  ansible.builtin.include_tasks: permissions.yml
  tags: [paperless, permissions]
  when:
    - paperless_group_sync_enabled | default(false)
    - paperless_permission_groups | default([]) | length > 0
