---
# roles/apps/paperless/tasks/main.yml

- name: Deploy Paperless-NGX
  ansible.builtin.import_tasks: deploy.yml
  tags: [paperless, deploy]

- name: Configure OIDC for Paperless
  ansible.builtin.import_tasks: oidc.yml
  tags: [paperless, oidc]
  when: paperless_oidc_enabled | default(false)

- name: Configure group permissions for Paperless
  ansible.builtin.import_tasks: permissions.yml
  tags: [paperless, permissions]
  when: paperless_group_permissions_enabled | default(false)
