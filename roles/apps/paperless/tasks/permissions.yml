---
# roles/apps/paperless/tasks/permissions.yml
# Set up document-level permissions for configured permission groups.
# Creates workflow for auto-assign view/change, deploys post-consume script
# for delete permission (django-guardian), and patches existing documents.
#
# Only runs for groups listed in paperless_permission_groups.
# Group sync (sync-groups.yml) should run first to ensure groups exist.

- name: Create scripts directory
  ansible.builtin.file:
    path: "{{ paperless_data_path }}/scripts"
    state: directory
    mode: "0755"

- name: Deploy post-consume script
  ansible.builtin.template:
    src: post-consume.sh.j2
    dest: "{{ paperless_data_path }}/scripts/post-consume.sh"
    mode: "0755"
  notify: restart paperless

- name: Configure workflow and permissions for each group
  ansible.builtin.command: >
    docker exec paperless python3 manage.py shell -c "
    import json, sys
    from documents.models import Workflow, WorkflowTrigger, WorkflowAction
    from documents.models import Document
    from django.contrib.auth.models import Group
    from guardian.shortcuts import assign_perm

    perm_groups = json.loads(sys.stdin.read())

    for group_name in perm_groups:
        try:
            g = Group.objects.get(name=group_name)
        except Group.DoesNotExist:
            print(f'{group_name}: SKIP (group not found — run sync-groups first)')
            continue

        # --- Workflow for auto-assign view/change on new documents ---
        wf_name = f'{group_name}-Gruppe zuweisen'
        wf, wf_created = Workflow.objects.get_or_create(
            name=wf_name,
            defaults={'enabled': True}
        )

        if wf_created:
            trigger = WorkflowTrigger.objects.create(type=1, filter_filename='*')
            wf.triggers.add(trigger)
            action = WorkflowAction.objects.create(
                assign_owner=None,
                remove_all_owners=True
            )
            action.assign_view_groups.add(g)
            action.assign_change_groups.add(g)
            wf.actions.add(action)
            print(f'{group_name}: workflow created')
        else:
            for action in wf.actions.all():
                action.assign_view_groups.add(g)
                action.assign_change_groups.add(g)
                action.remove_all_owners = True
                action.assign_owner = None
                action.save()
            print(f'{group_name}: workflow updated')

        # --- Patch existing documents: view/change/delete ---
        count = 0
        for doc in Document.objects.all():
            for perm in ['view_document', 'change_document', 'delete_document']:
                assign_perm(perm, g, doc)
            count += 1
        print(f'{group_name}: {count} existing documents patched')

    # --- Remove owner from all documents ---
    no_owner = Document.objects.exclude(owner=None).update(owner=None)
    if no_owner:
        print(f'Removed owner from {no_owner} documents')
    "
  args:
    stdin: "{{ paperless_permission_groups | to_json }}"
  register: _pl_perm_result
  changed_when: "'created' in _pl_perm_result.stdout or 'patched' in _pl_perm_result.stdout"
  when: paperless_permission_groups | length > 0

- name: Permission setup result
  ansible.builtin.debug:
    msg: "{{ _pl_perm_result.stdout_lines }}"
  when: _pl_perm_result is defined and _pl_perm_result is not skipped
