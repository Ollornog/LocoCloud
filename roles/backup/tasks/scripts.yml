---
# roles/backup/tasks/scripts.yml
# Deploy backup and pre-backup scripts

- name: Deploy pre-backup DB dump script
  ansible.builtin.template:
    src: pre-backup.sh.j2
    dest: "{{ backup_script_path }}/pre-backup.sh"
    mode: "0700"

- name: Deploy main backup script
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_script_path }}/backup.sh"
    mode: "0700"

- name: Deploy Restic exclude file
  ansible.builtin.template:
    src: restic-excludes.txt.j2
    dest: "{{ backup_script_path }}/restic-excludes.txt"
    mode: "0644"

- name: Deploy restore helper script
  ansible.builtin.copy:
    dest: "{{ backup_script_path }}/restore.sh"
    mode: "0700"
    content: |
      #!/bin/bash
      # Restore from Restic backup
      # Usage: restore.sh <repo-url> [snapshot-id] [target-path]
      set -euo pipefail
      REPO="$1"
      SNAPSHOT="${2:-latest}"
      TARGET="${3:-/opt/restore}"
      PASSWORD_FILE="{{ backup_script_path }}/.restic-password"

      echo "Available snapshots:"
      restic -r "$REPO" --password-file "$PASSWORD_FILE" snapshots

      echo ""
      echo "Restoring snapshot $SNAPSHOT from $REPO to $TARGET..."
      mkdir -p "$TARGET"
      restic -r "$REPO" --password-file "$PASSWORD_FILE" restore "$SNAPSHOT" --target "$TARGET"
      echo "Restore complete: $TARGET"

- name: Install mail utilities for alerts
  ansible.builtin.apt:
    name:
      - msmtp
      - bsd-mailx
    state: present
  when: backup.alert_email | default(backup_alert_email) | length > 0
