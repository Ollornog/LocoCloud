---
# roles/backup/tasks/cron.yml

- name: Setup backup cron job
  ansible.builtin.cron:
    name: "lococloudd-backup"
    job: "{{ backup_script_path }}/backup.sh >> /var/log/lococloudd-backup.log 2>&1"
    minute: "{{ (backup.schedule | default(backup_schedule)).split(' ')[0] }}"
    hour: "{{ (backup.schedule | default(backup_schedule)).split(' ')[1] }}"
    day: "{{ (backup.schedule | default(backup_schedule)).split(' ')[2] }}"
    month: "{{ (backup.schedule | default(backup_schedule)).split(' ')[3] }}"
    weekday: "{{ (backup.schedule | default(backup_schedule)).split(' ')[4] }}"
    user: root
    state: present
  when: backup.enabled | default(false)

- name: Setup weekly Restic check cron
  ansible.builtin.cron:
    name: "lococloudd-backup-check"
    job: >-
      {{ backup_script_path }}/backup-check.sh >> /var/log/lococloudd-backup-check.log 2>&1
    minute: "{{ (backup.check_schedule | default(backup_check_schedule)).split(' ')[0] }}"
    hour: "{{ (backup.check_schedule | default(backup_check_schedule)).split(' ')[1] }}"
    day: "{{ (backup.check_schedule | default(backup_check_schedule)).split(' ')[2] }}"
    month: "{{ (backup.check_schedule | default(backup_check_schedule)).split(' ')[3] }}"
    weekday: "{{ (backup.check_schedule | default(backup_check_schedule)).split(' ')[4] }}"
    user: root
    state: present
  when: backup.enabled | default(false)

- name: Deploy Restic check script
  ansible.builtin.copy:
    dest: "{{ backup_script_path }}/backup-check.sh"
    mode: "0700"
    content: |
      #!/bin/bash
      # Weekly Restic repo integrity check
      set -euo pipefail
      PASSWORD_FILE="{{ backup_script_path }}/.restic-password"
      LOG_FILE="/var/log/lococloudd-backup-check.log"
      ALERT_EMAIL="{{ backup.alert_email | default(backup_alert_email) }}"

      log() { echo "[$(date '+%Y-%m-%d %H:%M:%S')] $1" | tee -a "$LOG_FILE"; }

      ERRORS=0
      {% for target in backup.targets | default([]) %}
      log "Checking repo: {{ target.name }}"
      if restic -r "sftp:{{ target.name }}:{{ target.path }}" --password-file "$PASSWORD_FILE" check 2>&1 | tee -a "$LOG_FILE"; then
          log "OK: {{ target.name }}"
      else
          log "FEHLER: {{ target.name }} check fehlgeschlagen"
          ((ERRORS++)) || true
      fi
      {% endfor %}

      if [ $ERRORS -gt 0 ] && [ -n "$ALERT_EMAIL" ] && command -v mail >/dev/null 2>&1; then
          echo "Restic check FEHLER auf $(hostname): $ERRORS Repo(s) fehlerhaft" | \
              mail -s "BACKUP CHECK FEHLER: $(hostname)" "$ALERT_EMAIL" 2>/dev/null || true
      fi
  when: backup.enabled | default(false)

- name: Setup logrotate for backup logs
  ansible.builtin.copy:
    dest: /etc/logrotate.d/lococloudd-backup
    mode: "0644"
    content: |
      /var/log/lococloudd-backup.log
      /var/log/lococloudd-backup-check.log {
          weekly
          rotate 8
          compress
          missingok
          notifempty
      }
